<script>
    // define the javascript functions to be called from the Java application running on the CheerpJ JVM in the browser

    // Called from Java to ask the user for a file. The input is never added to the document:
    // click() opens the dialog on a detached element, so there is nothing to clean up if the
    // user cancels.
    async function Java_com_manchesterbaby_baby_utils_CheerpJUtils_getFileForSimulator() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.asm,.snp';

        input.onchange = async () => {
            const file = input.files[0];
            if (!file) return;
            const path = "/str/" + file.name;
            try {
                // copying the text into the sandbox filesystem is much simpler than mounting
                cheerpOSAddStringFile(path, await file.text());
                await window.myApplication.openFile(path);
            } catch (e) {
                console.error(`Could not open "${file.name}":`, e);
            }
        };

        input.click();
    }

    // Called from java
    // Requests URL params
    // Recall first param is always the CheerpJ library object hence lib as first param, per https://cheerpj.com/docs/guides/implementing-native-methods.html
    async function Java_com_manchesterbaby_baby_utils_CheerpJUtils_getURLparam(lib, paramName) {
        console.log("Java requested URL param:", paramName);
        return urlParams.get(paramName);
    }

    // Called from Java
    // Assigns the Java application instance to window.myApplication.
    // Ensures continuous access by preventing the function from returning.
    async function Java_com_manchesterbaby_baby_utils_CheerpJUtils_nativeSetApplication(
        lib,
        myApplication
    ) {
        window.myApplication = myApplication;
        console.log("Java application instance set on JavaScript side.");
        return new Promise(() => {}); // Keeps the function from returning
    }

</script>

<script>
    // Browser zoom shows up as a change in device pixel ratio, reported on resize. The Java
    // side repaints when told, as zooming tends to leave the display dirty.
    let lastPixelRatio = window.devicePixelRatio;
    window.addEventListener('resize', () => {
        if (window.devicePixelRatio === lastPixelRatio) return;
        lastPixelRatio = window.devicePixelRatio;
        console.log('Browser zoom level changed:', lastPixelRatio);
        window.myApplication?.onBrowserZoomChange(lastPixelRatio);
    });

    // F5 and F10 are the Simulator's own keys, so the browser must not act on them. CheerpJ is
    // handed this as overrideShortcuts below, which sees key events inside the display as well;
    // a listener on this document does not.
    function isSimulatorShortcut(event) {
        return event.key === 'F5' || event.key === 'F10';
    }

</script>

<div id="console_output" class="strip"></div>

<script>

    // What the footer reports, so a support question arrives with the platform attached.
    // First match wins, so the order of these matters.
    const OS_PATTERNS = [
        [/Windows/, 'Windows'],
        // mobile first: an Android agent also says Linux, and an iPad can say Macintosh
        [/Android/, 'Android'],
        [/iPhone|iPad|iPod/, 'iOS'],
        [/Mac/, 'macOS'],
        [/Linux/, 'Linux'],
    ];
    const BROWSER_PATTERNS = [
        [/Firefox\/([\d.]+)/, 'Firefox'],
        // Edge before Chrome: it reports both, and Safari last as everything says Safari
        [/Edg\/([\d.]+)/, 'Edge'],
        [/Chrome\/([\d.]+)/, 'Chrome'],
        [/Version\/([\d.]+).*Safari/, 'Safari'],
    ];

    function describe(patterns, userAgent, fallback) {
        for (const [pattern, name] of patterns) {
            const match = userAgent.match(pattern);
            if (match) return match[1] ? `${name} ${match[1]}` : name;
        }
        return fallback;
    }

    function updateSystemInfo() {
        const agent = navigator.userAgent;
        document.getElementById('system_info').textContent =
            `os:${describe(OS_PATTERNS, agent, 'Unknown OS')}`
            + ` | browser:${describe(BROWSER_PATTERNS, agent, 'Unknown Browser')}`
            + ` | cheerpj:${cheerpjVersion} | baby:${jarVersion}`;
    }
    
    // With ?debug=yes the console is mirrored into the page, for machines where devtools are
    // not an option. Installed before cheerpjInit so the startup messages are caught too.
    if (showDebug) {
        const consoleDiv = document.getElementById('console_output');

        function appendToConsole(message, isError) {
            consoleDiv.style.display = 'block';
            const line = document.createElement('div');
            if (isError) line.className = 'error';
            // textContent, not innerHTML: a log message is text, and may well contain a <
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        for (const [name, prefix] of [['log', ''], ['error', 'ERROR: ']]) {
            const original = console[name];
            console[name] = (...args) => {
                appendToConsole(prefix + args.join(' '), name === 'error');
                original.apply(console, args);
            };
        }

        // addEventListener rather than window.onerror, which would replace any other handler
        window.addEventListener('error', (event) => {
            appendToConsole(`UNHANDLED ERROR: ${event.message}\nAt: ${event.filename}:${event.lineno}:${event.colno}`, true);
        });
    }

    // Wait for the script to load before initializing CheerpJ
    (async function () {
        // Check if browser supports clipboard-read permission
        // otherwise cheerpJ fails horribly on Safari and on Firefox with error:
        // Uncaught (in promise) TypeError: 'clipboard-read' (value of 'name' member of PermissionDescriptor) is not a valid value for enumeration PermissionName.
        let clipboardMode = 'system';
        try {
            // Try to query clipboard-read permission to check if it's supported
            await navigator.permissions.query({ name: 'clipboard-read' });
            clipboardMode = 'permission';
        } catch (e) {
            console.log('Clipboard-read permission not supported, using system clipboard mode');
        }
        console.log('Using clipboard mode:', clipboardMode);

        await cheerpjInit({
            // must match <release> in pom.xml; CheerpJ defaults to Java 8 if omitted
            version: 11,
            licenseKey:"v1-78XJpCYyasiWIQVMqUfwXea3tVk=",
            clipboardMode: clipboardMode,
            // F5 and F10 belong to the Simulator, not the browser
            overrideShortcuts: isSimulatorShortcut,
            // Startup can be cut further by preloading the runtime files the simulator actually
            // touches: run cjGetRuntimeResources() in the browser console once it is up, and
            // paste what it prints in here as preloadResources.
            // https://cheerpj.com/docs/guides/Startup-time-optimization.html
            natives: {
                Java_com_manchesterbaby_baby_utils_CheerpJUtils_getFileForSimulator,
                Java_com_manchesterbaby_baby_utils_CheerpJUtils_nativeSetApplication,           
                Java_com_manchesterbaby_baby_utils_CheerpJUtils_getURLparam
            }
        });
        // Same size as the window in Baby.java, and given a parent so it lands inside #display
        // rather than at the end of the body, which is what the footer used to be moved around.
        const display = cheerpjCreateDisplay(700, 950, document.getElementById('display'));

        // Keyboard input only reaches the JVM while CheerpJ's own display has focus, and the
        // iframe it puts there does not exist the instant the display is created.
        const focusDisplay = () => (display.querySelector('iframe') || display).focus();
        const waitForDisplay = setInterval(() => {
            if (display.querySelector('iframe')) {
                clearInterval(waitForDisplay);
                focusDisplay();
            }
        }, 100);
        // Hand focus back when the tab is returned to, but leave clicks on the page's own links
        // alone: stealing focus from those made them unreachable by keyboard.
        window.addEventListener('focus', focusDisplay);

        // Update system info after CheerpJ is initialized
        updateSystemInfo();
        
        // Load the Java application using the specified jar file
        // e.g. baby.jar
        // if running on davidsharp.com this need amending to /app/baby/baby.jar as no longer in route of webserver folder
        await cheerpjRunJar('/app/baby.jar');
    })();

</script>
